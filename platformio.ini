; Two small programs for learning buttons on an ESP32-C3. Same pins as the
; TronIdentityDisc disc, so the breadboard layout carries over to the
; protoboard.
;
;   pio run -e wiring-test -t upload && pio device monitor   ; step 1
;   pio run -e buttons     -t upload && pio device monitor   ; step 2

[common]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Step 1: no LEDs, no debouncing. Prints every raw change on every button
; pin so you can check wiring and see contact bounce for yourself.
[env:wiring-test]
extends = common
build_src_filter = +<wiring_test.cpp>

; Step 2: debounced press / release / hold, driving an LED strip.
[env:buttons]
extends = common
build_src_filter = +<buttons.cpp>
lib_deps =
    fastled/FastLED@3.10.3   ; newer releases fail to build on espressif32 6.x (Arduino core 2.x)

[platformio]
default_envs = wiring-test
